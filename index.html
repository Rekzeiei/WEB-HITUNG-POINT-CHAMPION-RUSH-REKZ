<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Champion Rush</title>

<style>

/* ===== BODY ===== */

body{
margin:0;
background:
linear-gradient(
135deg,
#1b0036,
#3d0070,
#6a00ff
);
font-family:Arial;
color:white;
}

/* ===== CONTAINER ===== */

.container{
padding:20px;
max-width:1800px;
margin:auto;
}

/* ===== HEADER ===== */

.header{
background:
linear-gradient(
135deg,
rgba(125,0,255,.95),
rgba(70,0,130,.95)
);
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:
0 0 25px
rgba(170,0,255,.6);
border:
2px solid
rgba(255,255,255,.15);
}

.title{
font-size:48px;
color:#ffffff;
font-weight:bold;
text-shadow:
0 0 15px #c77dff,
0 0 30px #7b2cff;
letter-spacing:2px;
}

.info{
display:flex;
justify-content:center;
gap:12px;
margin-top:15px;
flex-wrap:wrap;
}

.info div{
background:
rgba(255,255,255,.12);
padding:12px 18px;
border-radius:14px;
backdrop-filter:blur(6px);
border:
1px solid
rgba(255,255,255,.1);
}

/* ===== TARGET ===== */

.target{
margin-top:20px;
display:inline-block;
background:
linear-gradient(
90deg,
#ff00ff,
#8a2eff
);
padding:14px 28px;
border-radius:40px;
font-weight:bold;
box-shadow:
0 0 20px
rgba(255,0,255,.5);
}

/* ===== PODIUM ===== */

.podium{
display:flex;
gap:20px;
justify-content:center;
margin-top:35px;
flex-wrap:wrap;
}

.card{
width:320px;
padding:25px;
border-radius:25px;
text-align:center;
border:
2px solid
rgba(255,255,255,.12);
box-shadow:
0 0 20px
rgba(0,0,0,.3);
}

.rank1{
background:
linear-gradient(
135deg,
#ff00ea,
#6a00ff
);
}

.rank2{
background:
linear-gradient(
135deg,
#4f46e5,
#7c3aed
);
}

.rank3{
background:
linear-gradient(
135deg,
#9333ea,
#581c87
);
}

.icon{
font-size:70px;
}

.podiumName{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.podiumInfo{
color:#ddd;
margin-top:10px;
font-size:17px;
}

.podiumScore{
font-size:60px;
color:#fff;
font-weight:bold;
text-shadow:
0 0 15px #ff00ff;
}

/* ===== TABLE ===== */

.tableWrap{
width:100%;
overflow-x:auto;
margin-top:35px;
border-radius:20px;
}

table{
width:100%;
min-width:1700px;
border-collapse:collapse;
background:
rgba(18,0,40,.85);
backdrop-filter:blur(8px);
overflow:hidden;
border-radius:20px;
}

th{
background:
linear-gradient(
90deg,
#6a00ff,
#b100ff
);
padding:14px;
white-space:nowrap;
font-size:15px;
}

td{
padding:12px;
text-align:center;
border-bottom:
1px solid
rgba(255,255,255,.08);
white-space:nowrap;
}

/* ===== INPUT ===== */

input{
width:70px;
padding:9px;
background:
rgba(255,255,255,.08);
border:
1px solid
rgba(255,255,255,.1);
color:white;
border-radius:10px;
outline:none;
}

input:focus{
border:
1px solid #d946ef;
box-shadow:
0 0 10px #d946ef;
}

.team{
width:180px;
}

/* ===== SELECT ===== */

select{
padding:9px;
background:
rgba(255,255,255,.08);
border:
1px solid
rgba(255,255,255,.1);
color:white;
border-radius:10px;
}

/* ===== STATUS ===== */

.champion{
color:#00ff99;
font-weight:bold;
text-shadow:
0 0 10px #00ff99;
}

.unlock{
color:#ffe600;
font-weight:bold;
text-shadow:
0 0 10px #ffe600;
}

.gagal{
color:#ff4d6d;
font-weight:bold;
}

/* ===== SCROLLBAR ===== */

::-webkit-scrollbar{
height:10px;
width:10px;
}

::-webkit-scrollbar-track{
background:#2a004d;
}

::-webkit-scrollbar-thumb{
background:#a100ff;
border-radius:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">

TABEL POINT CHAMPION RUSH BY REKZ⚡

</div>

<div class="info">

<div id="organizer"></div>

<div id="phone"></div>

</div>

<div class="target">

🔥 Champion Rush = 80 Point + Booyah 🏆

</div>

</div>

<div class="podium">

<div class="card rank2">

<div class="icon">🥈</div>

<div class="podiumName team2">-</div>

<div class="podiumInfo info2"></div>

<div class="podiumScore score2">0</div>

</div>

<div class="card rank1">

<div class="icon">🏆</div>

<div class="podiumName team1">-</div>

<div class="podiumInfo info1"></div>

<div class="podiumScore score1">0</div>

</div>

<div class="card rank3">

<div class="icon">🥉</div>

<div class="podiumName team3">-</div>

<div class="podiumInfo info3"></div>

<div class="podiumScore score3">0</div>

</div>

</div>

<div class="tableWrap">

<table id="table">

<tr>

<th>#</th>

<th>TEAM</th>

<th>M1</th>
<th>P1</th>

<th>M2</th>
<th>P2</th>

<th>M3</th>
<th>P3</th>

<th>M4</th>
<th>P4</th>

<th>M5</th>
<th>P5</th>

<th>M6</th>
<th>P6</th>

<th>KILL</th>

<th>POINTS</th>

<th>BOOYAH</th>

<th>TOTAL</th>

<th>STATUS</th>

</tr>

</table>

</div>

</div>

<script>

/* ===== EDIT ===== */

const EVENT_ORGANIZER=
"Rekzeiei";

const PHONE=
"089521336961";

const TARGET=
80;

const DEFAULT_TEAM=
12;

/* ================ */

organizer.innerHTML=
"📋 "+EVENT_ORGANIZER;

phone.innerHTML=
"📱 "+PHONE;

function tambahTim(){

let row=
document.createElement(
"tr"
);

let match="";

for(
let i=1;
i<=6;
i++
){

match+=`

<td>

<input
class=point
type=number
value=0>

</td>

<td>

<input
class=placement
type=number
value=0>

</td>

`;

}

row.innerHTML=`

<td class=rank></td>

<td>

<input
class=team
placeholder="Nama Tim">

</td>

${match}

<td class=kill>

0

</td>

<td class=placementTotal>

0

</td>

<td>

<select class=booyah>

<option>Tidak</option>

<option>Ya</option>

</select>

</td>

<td class=total>

0

</td>

<td class="status gagal">

BELUM

</td>

`;

table.append(
row
);

row.querySelectorAll(
"input,select"
)

.forEach(

x=>

x.oninput=
update

);

update();

}

function update(){

let rows=
[
...table.rows
]

.slice(1);

let data=[];

rows.forEach(

r=>{

let kill=0;

r.querySelectorAll(
".point"
)

.forEach(

x=>

kill+=
+(
x.value
||
0
)

);

let placement=0;

r.querySelectorAll(
".placement"
)

.forEach(

x=>

placement+=
+(
x.value
||
0
)

);

let booyah=

r.querySelector(
".booyah"
)

.value==="Ya";

let total=
kill+
placement;

r.querySelector(
".kill"
)

.innerHTML=
kill;

r.querySelector(
".placementTotal"
)

.innerHTML=
placement;

r.querySelector(
".total"
)

.innerHTML=
total;

let status=
"BELUM";

let statusClass=
"status gagal";

let champion=

total>=TARGET
&&
booyah;

if(
champion
){

status=
"🏆 CHAMPION";

statusClass=
"status champion";

}

else if(
total>=TARGET
){

status=
"⚡ CHAMP RUSH";

statusClass=
"status unlock";

}

r.querySelector(
".status"
)

.innerHTML=
status;

r.querySelector(
".status"
)

.className=
statusClass;

data.push({

row:r,

team:

r.querySelector(
".team"
).value

||

"-",

kill,

placement,

total,

champion

});

});

data.sort(

(a,b)=>{

if(
a.champion
&&
!b.champion
)
return -1;

if(
b.champion
&&
!a.champion
)
return 1;

return b.total-a.total;

}

);

data.forEach(

(v,i)=>{

v.row.querySelector(
".rank"
)

.innerHTML=
i+1;

});

for(
let i=1;
i<=3;
i++
){

let t=
data[i-1];

if(!t)
continue;

document.querySelector(
".team"+i
)

.innerHTML=
t.team;

document.querySelector(
".info"+i
)

.innerHTML=

`${t.kill} Kill | ${t.total} Points`;

document.querySelector(
".score"+i
)

.innerHTML=
t.total;

}

}

for(
let i=0;
i<DEFAULT_TEAM;
i++
)

tambahTim();

</script>

</body>

</html>
